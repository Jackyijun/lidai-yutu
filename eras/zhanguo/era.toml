# 第二卷 战国：卷的基本信息。统一前端、总页时间轴和全局表都从这里读。
# 字段说明见 core/v1/FORMAT.md「era.toml」一节。

slug = "zhanguo"
volume = 2
title = "战国列国形势图"
title_en = "The Warring States"
short = "战国"            # 总页与时间轴上的短名
short_en = "Warring States"

years = [-475, -212]          # 起止年（含），公元前记负数，与总页一致
time = "year"             # 节点的时间精度：year 按年，month 按月
model = "simple"          # 数据模型：simple（战国式）或 layered（唐宋系）
first = -350                 # 打开页面时停在哪一年的节点
nodes = 49                 # 节点数（构建时核对）

[coloring]                  # 着色切换：按钮文字与内部代号；没有切换的卷为空
modes = []

[layers]                    # 本卷用到的条目类别及条数（核对用）
town = 142
river = 54
jun = 51
battle = 50
capital = 46
culture = 32
city = 28
range = 24
pass = 20
people = 18
wall = 10
road = 3

[projection]                # 新页面的投影：第 4 步起八卷统一，参数以 core/geo/config.toml 为准
kind = "albers"
parallels = [25, 47]
origin_lat = 35
central_lon = 105
seam = -30                  # 接缝经度，小于它的经度加 360°
legacy = [33, 112]           # 旧版页面（legacy.html）用的原点纬线、中央经线

[junction.prev]
era = "chunqiu"
at = "-476 / -475"
note = "相邻两年，不共用节点"

[junction.next]
era = "hanmosanguo"
at = "空档 -212 — 184"
note = "秦汉卷 qinhan 待补"

[legacy]                    # 旧版：原仓库与原网址保持不变，总页上留「旧版 ↗」链接
repo = "Jackyijun/zhanguo-map"
url = "https://jackyijun.github.io/zhanguo-map/"
new_url = "https://jackyijun.github.io/lidai-yutu/zhanguo/"
