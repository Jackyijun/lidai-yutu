# 第二卷 战国：卷的基本信息。统一前端、总页时间轴和全局表都从这里读。
# 字段说明见 core/v1/FORMAT.md「era.toml」一节。

slug = "zhanguo"
volume = 2
title = "战国列国形势图"
title_en = "The Warring States"
short = "战国"            # 总页与时间轴上的短名
short_en = "Warring States"

years = [-475, -212]          # 起止年（含），公元前记负数，与总页一致
time = "year"             # 节点的时间精度：year 按年，month 按月
first = -350                 # 打开页面时停在哪一年的节点
nodes = 49                 # 节点数（构建时核对）

[coloring]                  # 着色切换：按钮文字与内部代号；没有切换的卷为空
modes = []

[layers]                    # 本卷用到的条目类别及条数（核对用）
town = 142
river = 54
jun = 51
battle = 50
capital = 46
culture = 32
city = 28
range = 24
pass = 20
people = 18
wall = 10
road = 3

[projection]                # 新页面的投影：第 4 步起各卷统一，参数以 core/geo/config.toml 为准
kind = "albers"
parallels = [25, 47]
origin_lat = 35
central_lon = 105
seam = -30                  # 接缝经度，小于它的经度加 360°
legacy = [33, 112]           # 旧版页面（原仓库的网页，见 [legacy]）用的原点纬线、中央经线

[junction.prev]
era = "chunqiu"
at = "-476 / -475"
note = "相邻两年，不共用节点"

[junction.next]
era = "qinhan"
at = "-212"
note = "共用节点，以本卷为准：秦汉卷首节点照搬本卷末节点的秦、卫外廓与秦郡郡界"


[engine]                    # 统一疆域引擎（core/engine/）的外缘设置；归属点取两卷共用的 content/seeds.txt
outer = "box"               # box 以内的陆地全部分给最近的点，外缘由不属任何一方的点（·）定，同旧构建
geometry = "engine"         # 第 7 步起页面疆域由统一引擎出：eras/zhanguo/engine.json（构建时重算，入库），生成 v1 时换进去
box = [97.0, 128.5, 18.0, 44.5]   # 推算范围 [西, 东, 南, 北]，同旧构建的栅格范围（src/config.py 的 LON0、LON1、LAT0、LAT1），两卷相同
simplify = 0.25             # 覆盖简化容差（格，约 1.8 km），与旧构建（0.018°）相当；默认 0.06 格时页面大七成
labels = "zhanguo"          # 单位注记按战国式页面的写法：陆上最大的一块另加飞地，最多 3 处
sub.unit = "秦"              # 秦的格子按郡治就近细分，出秦郡界（同旧构建）
sub.hosts = ["秦", "卫"]     # 郡治须落在这些单位的疆域里才参与（东郡治濮阳，前241 起卫君徙野王，濮阳一带仍按旧构建计入）
# sub.near（离 hosts 疆域不到几格的郡治也算）原写 4，为前277 起的洞庭郡治而设；2026-11-21 洞庭郡改为前222 置后删去：
# 留着只会让河东郡在郡治安邑还属魏的前290 提前一期画出
sub.seats = "jun"           # 郡治取本卷这一类条目（键 k、郡治经纬度、始置年；content/features.py 的 JUN）
sub.fixed = [["下辨", "陇西"]]   # 这些归属点的势力格整块归某郡，不按郡治远近分：下辨（甘肃成县西）是秦陇西郡属县
                            # （秦封泥「下辨丞印」、张家山汉简《秩律》），单按郡治远近会分给汉中郡；每项 [归属点, 郡]

[legacy]                    # 旧版：原仓库与原网址保持不变，总页上留「旧版 ↗」链接
repo = "Jackyijun/zhanguo-map"
url = "https://jackyijun.github.io/zhanguo-map/"
new_url = "https://jackyijun.github.io/lidai-yutu/zhanguo/"

