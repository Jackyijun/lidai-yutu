foot = ["中国疆域据各时期官方文书、战史与谭其骧《中国历史地图集》第八册等大意推定；国际与殖民地界以今国界为基础按年代修订（三八线、北纬五十度线等），境内派系、根据地与战线以城市、县城的控制为单位沿山川推算，仅为示意。斜线表示名义归属与实际控制不一致：傀儡政权、名义服从中央的地方实力派、受保护国与委任统治地、名义属国民政府的中共边区等。战役、事件与行军路线只显示当前节点所涵盖的月份（上一节点之后至本节点）。", "Chinese territories follow official records, campaign histories and, in outline, vol. 8 of Tan Qixiang’s Historical Atlas of China; international and colonial borders start from modern boundaries revised for the period (the 38th parallel, the 50th parallel on Sakhalin, etc.); factions, base areas and front lines inside China are reconstructed from the control of cities and county towns and bounded along mountains and rivers, so they are only indicative. Hatching marks a gap between nominal and actual control: puppet regimes, regional strongmen nominally under the central government, protectorates and mandates, and the Communist border regions nominally under the Nationalist government. Battles, events and campaign routes are shown only for the months covered by the current snapshot."]
