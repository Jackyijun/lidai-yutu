# 第九卷 民国至新中国：卷的基本信息。统一前端、总页时间轴和全局表都从这里读。
# 字段说明见 core/v1/FORMAT.md「era.toml」一节。

slug = "minguo-xinzhongguo"
volume = 9
title = "民国至新中国初期形势图"
title_en = "Republican China to the Early PRC"
short = "民国至新中国"            # 总页与时间轴上的短名
short_en = "ROC–PRC"

years = [1911, 1954]          # 起止年（含），公元前记负数，与总页一致
time = "month"             # 节点的时间精度：year 按年，month 按月
model = "layered"          # 数据模型：simple（战国式）或 layered（唐宋系）
first = [1937, 12]         # 打开页面时停在哪个节点（年、月）
nodes = 115                 # 节点数（构建时核对）

[coloring]                  # 着色切换：按钮文字与内部代号；没有切换的卷为空
modes = [{ label = "派系", key = "zhen" }, { label = "政权", key = "pol" }]
default = "派系"

[layers]                    # 本卷用到的条目类别及条数（核对用）
event = 499
battle = 471
river = 149
capital = 134
range = 85
rail = 84
route = 82
conc = 49
pass = 33
desert = 12
road = 6
canal = 2
air = 2

[projection]                # 新页面的投影：第 4 步起各卷统一，参数以 core/geo/config.toml 为准
kind = "albers"
parallels = [25, 47]
origin_lat = 35
central_lon = 105
seam = -30                  # 接缝经度，小于它的经度加 360°
legacy = [32, 103]           # 旧版页面（legacy.html）用的原点纬线、中央经线

[engine]                    # 第 5 步统一疆域引擎（core/engine/）的外缘设置；归属点与节点取 v1 数据包
outer = "reach"             # 按可达代价定外缘（参数见 core/engine/config.toml 的 [outer]）
geometry = "engine"         # 第 7 步起页面疆域由统一引擎出：eras/minguo-xinzhongguo/engine.json（构建时重算，入库），生成 v1 时换进去
simplify = 0.25             # 覆盖简化容差（格，约 1.8 km）：默认 0.06 格时页面疆域约翻倍（民国卷超过 20 MB），放宽到与旧引擎相当
box = [26.0, 180.0, -11.0, 72.0]  # 推算范围 [西, 东, 南, 北]
config = "src/config.py"    # 从这里读 EXCLUDE（推算范围里剔除的欧洲、非洲）与国界墙（WALL_SKIP、VAR_NE_WALLS、MANUAL_WALLS）
seeds = "content/seeds"     # 各点可达倍数（R=）写在这里
walls = true                # 今国界与手画的历史界线烧成墙
prov_walls = true           # 今中国省界烧成弱墙

[junction.prev]
era = "songyuan"
at = "空档 1279 — 1911"
note = "元明卷 yuanming、清卷 qing 待补"

[legacy]                    # 旧版：原仓库与原网址保持不变，总页上留「旧版 ↗」链接
repo = "Jackyijun/minguo-xinzhongguo-map"
url = "https://jackyijun.github.io/minguo-xinzhongguo-map/"
new_url = "https://jackyijun.github.io/lidai-yutu/minguo-xinzhongguo/"
