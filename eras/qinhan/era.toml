# 图例脚注 [中, 英]
foot = ["疆域据《史记》《汉书》《后汉书》《资治通鉴》及谭其骧《中国历史地图集》第二册大意，由统一疆域引擎按郡国治所与县邑推算，沿山川划界，仅为示意。郡国以《汉书·地理志》（元始二年）与《续汉书·郡国志》为准，前180 年及以前用秦郡；王国的存废按《诸侯王表》，领域以元始二年的郡国近似。纪年从《资治通鉴》：太初改历（前104）以前以十月为岁首，十月至十二月记在新一年。斜线为名义内属（西域都护、西域长史所领诸国，50 年以后入居北边诸郡的南匈奴等）。「郡国」着色下匈奴按《史记》《汉书》《后汉书》分为单于本部、左右贤王、浑邪、休屠诸部，界线为示意。行军路线中本节点涵盖月份内走过的一段画实线加箭头，此前走过的画虚线。首节点照搬战国卷末节点，末节点照搬汉末三国卷首节点。", "Borders follow in outline the Shiji, the Han shu, the Hou Han shu, the Zizhi tongjian and vol. 2 of Tan Qixiang's Historical Atlas of China, and are computed by the unified territory engine from commandery seats and county towns, with boundaries drawn along mountains and rivers; they are approximate. Commanderies and kingdoms follow the Han shu Treatise on Geography (AD 2) and the Treatise on Commanderies and Kingdoms of the Xu Han shu; up to 180 BC the Qin commanderies are used. Kingdoms appear and disappear as in the Tables of the Kings, their extent approximated by the AD 2 units. Years follow the Zizhi tongjian: before the Taichu reform (104 BC) the year began in the 10th month, so the 10th–12th months belong to the new year. Hatching marks nominal submission (such as the states under the Protector-General or Chief Clerk of the Western Regions, or the Southern Xiongnu living inside the northern commanderies from AD 50). In the commanderies view the Xiongnu are divided, after the Shiji, the Han shu and the Hou Han shu, into the chanyu's own domain, the Wise Kings of the Left and Right, the Hunye and Xiutu kings and others; these borders are a sketch. Campaign routes are drawn solid with arrows only for the months covered by the current snapshot; earlier stretches are dashed. The first snapshot is copied from the last snapshot of the Warring States volume, the last from the first snapshot of the Late Han and the Three Kingdoms volume."]
