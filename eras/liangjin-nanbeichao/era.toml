foot = ["疆域据《晋书》、南北八史、《资治通鉴》《十六国春秋》辑本及谭其骧《中国历史地图集》第三、四册大意推定，以郡县为单位、沿山川划界，仅为示意；州郡点取当时的郡县治所，名称随年代变化，见各点“名称沿革”。280 年节点照搬《汉末三国形势图》末节点，581 年节点照搬《隋及唐初形势图》首节点，两端无缝衔接。斜线为名义臣属、实则自立的方镇或附庸；虚线疆域为部族，草原、高原诸部并无确切界线。萨珊、罗马、天竺、南海诸国只画大势。战役与事件只显示当前节点所涵盖的时段（上一节点之后至本节点）。点击疆域、城邑、战役、山川均可查看说明。", "Borders are inferred in outline from the Book of Jin, the eight histories of the Northern and Southern Dynasties, the Zizhi tongjian, the reconstituted Annals of the Sixteen Kingdoms and vols. 3–4 of Tan Qixiang’s Historical Atlas of China. Territory is assigned commandery by commandery and bounded along mountains and rivers, so it is only indicative; the points are the commandery and county seats of the time, whose names change over the years (see each point’s “Names”). The 280 snapshot copies the last snapshot of the Late Han and Three Kingdoms map and the 581 snapshot the first snapshot of the Sui and Early Tang map, so the maps join seamlessly at both ends. Hatching marks regional commands or dependencies that were nominal vassals but in fact independent; dashed territories are tribes, and the peoples of the steppe and the plateau had no fixed borders. Sasanian Persia, Rome, India and the states of the Southern Seas are shown only in broad outline. Battles and events are shown only for the period covered by the current snapshot (after the previous snapshot, up to this one). Click any territory, town, battle, mountain or river for a note."]
