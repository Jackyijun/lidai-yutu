# 所领地点一行的标题
holds_label = ["城邑", "Holds"]
# 不属任何政权的地点
unowned = ["诸夏以外", "outside the Zhou states"]
# 诸族年代：[起界, 起界文字, 止界, 止界文字, 「约」放最前]
