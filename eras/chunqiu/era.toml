# 诸侯着色下，图例列各国
legend_units = true
# 斜线单位（奉周的诸侯）在国的说明里的种类标签与「共主 周」的说法；奉周还是自立另起一行写依据，不再加 htag
vassal_tag = ["国", "State"]
overlord_word = ["共主", "Suzerain:"]
# 顶栏计数里二级单位的说法 [中, 英单数, 英复数]
count_zhen = ["国奉周", "state acknowledges Zhou", "states acknowledge Zhou"]
# 政权说明里「领 N 处」的说法 [中（{n} 为数）, 英单数, 英复数]
