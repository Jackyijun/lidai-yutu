key2 = ["奉周：名义属周，实各自治", "Acknowledges Zhou: nominally under Zhou, self-governing in practice"]
# 图例是否列「行军路线」
key_route = false
# 图例脚注 [中, 英]
foot = ["疆域据《左传》《史记》与谭其骧《中国历史地图集》第一册春秋图大意推定，边界为示意；淡色虚线为戎狄部族；不单独画出的小国并入邻近大国；战役、事件只显示本期（上一节点之后至本节点）。「共主」着色：受周封爵、未称王者为奉周（周色加斜线），称王或不在周的封建之内者为自立（本色）；楚称王后曾向周王进贡受赐，前671—前607 也算奉周。点击国名、地名、河流、山脉均可查看说明。", "Territories are reconstructed from the Zuozhuan, the Shiji and the general outline of the Spring and Autumn maps in Tan Qixiang's Historical Atlas of China, vol. 1; boundaries are schematic. Pale dashed areas are Rong and Di tribal peoples; small states not drawn separately are merged into a larger neighbour. Battles and events are shown for the current period only (after the previous snapshot, up to this one). In Suzerain colouring, states enfeoffed by Zhou that have not claimed kingship acknowledge Zhou (Zhou colour, hatched); states that claim kingship or stand outside the Zhou feudal order are independent (own colour). Chu, after claiming kingship, sent tribute to the Zhou king and received his gifts, so it also counts as acknowledging Zhou from 671 to 607 BC. Click any state, place, river or mountain range for notes."]
# 索引图高度（宽 140）
inset_h = 112
# 索引图范围 [西, 东, 南, 北]
inset_box = [97, 129, 20, 45.5]
# 经纬网：[经线起, 止, 纬度起, 止, 步长, 纬线起, 止, 经度起, 止, 步长]
grat = [95, 130, 18, 46, 1, 20, 45, 95, 130, 1]
# 斜线单位当藩属另画细虚线轮廓与国名
vassal = true
# 斜线画法：pol 只在政权（共主）着色下画，奉周的诸侯并入周、加斜线
hatch = "pol"
# 旧版链接的着色代号：st 诸侯、gz 共主
cm_alias = { st = "zhen", gz = "pol" }
# 诸侯着色下各国一律按政权画：奉周的诸侯不另作二级单位，不画周天下粗线
