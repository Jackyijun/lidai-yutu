# 「政权」的说法：顶栏计数、索引分组
pol_word = ["国"]
pol_group = ["列国", "States"]
# 名城要邑与一般城邑：名城 1.8 倍起画点、3.4 倍起标名（沿用两卷原来的倍数）；一般城邑为灰色小点，另列一组
