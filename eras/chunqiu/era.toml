# 第一卷 春秋：卷的基本信息。统一前端、总页时间轴和全局表都从这里读。
# 字段说明见 core/v1/FORMAT.md「era.toml」一节。

slug = "chunqiu"
volume = 1
title = "春秋列国形势图"
title_en = "The Spring and Autumn Period"
short = "春秋"            # 总页与时间轴上的短名
short_en = "Spring & Autumn"

years = [-770, -476]          # 起止年（含），公元前记负数，与总页一致
time = "year"             # 节点的时间精度：year 按年，month 按月
first = -632                 # 打开页面时停在哪一年的节点
nodes = 46                 # 节点数（构建时核对）

[coloring]                  # 着色切换：按钮文字与内部代号；没有切换的卷为空
modes = [{ label = "诸侯", key = "st" }, { label = "共主", key = "gz" }]
default = "诸侯"

[layers]                    # 本卷用到的条目类别及条数（核对用）
town = 94
capital = 92
battle = 64
river = 53
culture = 48
city = 27
range = 24
people = 20
pass = 16
wall = 2

[projection]                # 新页面的投影：第 4 步起各卷统一，参数以 core/geo/config.toml 为准
kind = "albers"
parallels = [25, 47]
origin_lat = 35
central_lon = 105
seam = -30                  # 接缝经度，小于它的经度加 360°
legacy = [33, 112]           # 旧版页面（原仓库的网页，见 [legacy]）用的原点纬线、中央经线

[junction.next]
era = "zhanguo"
at = "-476 / -475"
note = "相邻两年，不共用节点"


[engine]                    # 统一疆域引擎（core/engine/）的外缘设置；归属点取两卷共用的 content/seeds.txt
outer = "box"               # box 以内的陆地全部分给最近的点，外缘由不属任何一方的点（·）定，同旧构建
geometry = "engine"         # 第 7 步起页面疆域由统一引擎出：eras/chunqiu/engine.json（构建时重算，入库），生成 v1 时换进去
box = [97.0, 128.5, 18.0, 44.5]   # 推算范围 [西, 东, 南, 北]，同旧构建的栅格范围（src/config.py 的 LON0、LON1、LAT0、LAT1），两卷相同
simplify = 0.25             # 覆盖简化容差（格，约 1.8 km），与旧构建（0.018°）相当；默认 0.06 格时页面大七成
labels = "zhanguo"          # 单位注记按战国式页面的写法：陆上最大的一块另加飞地，最多 3 处

[legacy]                    # 旧版：原仓库与原网址保持不变，总页上留「旧版 ↗」链接
repo = "Jackyijun/chunqiu-map"
url = "https://jackyijun.github.io/chunqiu-map/"
new_url = "https://jackyijun.github.io/lidai-yutu/chunqiu/"
