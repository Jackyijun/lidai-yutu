# 英文检索框提示
q_en = "Search names"
# 英文对照表、年表导语里的年代说明
date_note_en = "Years are BC and given to the year only."
# 对照表导语（{n} 为节点数）
table_intro = ["<p>地图所标全部条目，一名一行。城邑的“归属沿革”取自地图上 {n} 个时间节点，连续相同的归属合并显示。经纬度取今日遗址或所在城市，可在任何地图应用中直接定位；线状要素（山脉、河流、长城）给出注记点。点击任一行回到地图并定位。</p>", "<p>Every entry on the map, one name per row. The allegiance of cities and towns is taken from the map’s {n} snapshots, with consecutive identical entries merged. Coordinates are those of today’s site or town and can be found in any map app; linear features (mountains, rivers, walls) give their label point. Click a row to return to the map and locate it.</p><p>{date_note}</p>"]
