# 运河开凿年份：[此年以前不写年份, 那时的说法, 「本期尚未开凿」加括号]
canal = [0, false, false]
# 时间轴刻度的样式：[字段, 比较, 值, 样式名]，取第一条符合的
era_cls = [["y", "<", 184, "era5"]]
# 时间轴提示里加节点标题
tl_t = true
# 播放每节点毫秒数（缺省 2400）
play_ms = 2600
