# 第四卷 汉末三国：卷的基本信息。统一前端、总页时间轴和全局表都从这里读。
# 字段说明见 core/v1/FORMAT.md「era.toml」一节。

slug = "hanmosanguo"
volume = 4
title = "汉末三国形势图"
title_en = "Late Han and the Three Kingdoms"
short = "汉末三国"            # 总页与时间轴上的短名
short_en = "Three Kingdoms"

years = [184, 280]          # 起止年（含），公元前记负数，与总页一致
time = "year"             # 节点的时间精度：year 按年，month 按月
first = 229                 # 打开页面时停在哪一年的节点
nodes = 35                 # 节点数（构建时核对）

[coloring]                  # 着色切换：按钮文字与内部代号；没有切换的卷为空
modes = [{ label = "诸侯", key = "zhen" }, { label = "政权", key = "pol" }]
default = "诸侯"

[layers]                    # 本卷用到的条目类别及条数（核对用）
river = 124
battle = 114
event = 47
range = 46
pass = 27
people = 26
canal = 12
capital = 12
road = 9
desert = 3

[projection]                # 新页面的投影：第 4 步起各卷统一，参数以 core/geo/config.toml 为准
kind = "albers"
parallels = [25, 47]
origin_lat = 35
central_lon = 105
seam = -30                  # 接缝经度，小于它的经度加 360°
legacy = [34, 108]           # 旧版页面（原仓库的网页，见 [legacy]）用的原点纬线、中央经线

[engine]                    # 统一疆域引擎（core/engine/）的外缘设置；归属点与节点取 v1 数据包
outer = "reach"             # 按可达代价定外缘（参数见 core/engine/config.toml 的 [outer]）
geometry = "engine"         # 第 7 步起页面疆域由统一引擎出：eras/hanmosanguo/engine.json（构建时重算，入库），生成 v1 时换进去
box = [72.0, 136.0, 14.0, 55.0]   # 推算范围 [西, 东, 南, 北]，同旧引擎的栅格范围（src/config.py 的 GRID_LON、GRID_LAT）
seeds = "build/reach.txt"   # 可达倍数 R=（由 src/build.py 从 content/seeds.py 的分区半径折算写出）
zones = "src/zhou.py"       # 按「诸侯 × 州」分块描界，另出州界与州名（同旧构建）
zone_label_min = 1.2        # 州名只标在面积大于此值（平方度）的州，同 src/config.py 的 ZHOU_LABEL_MIN_AREA

[junction.prev]
era = "qinhan"
at = "184"
note = "共用节点，以本卷为准（秦汉卷末节点照搬本卷首节点）"

[junction.next]
era = "liangjin-nanbeichao"
at = "280"
note = "共用节点，以本卷为准"

[legacy]                    # 旧版：原仓库与原网址保持不变，总页上留「旧版 ↗」链接
repo = "Jackyijun/hanmosanguo-map"
url = "https://jackyijun.github.io/hanmosanguo-map/"
new_url = "https://jackyijun.github.io/lidai-yutu/hanmosanguo/"

[web]                       # 新页面（core/web/template.html）各卷不同的文字与开关，说明见 core/web/README.md
# 时间单位：year 年；ym 年 + 月（隋唐、两晋）；t 月序号（民国）；qinhan 月序号、通鉴纪年（秦汉）
time = "year"
# 旧版页面记界面语言用的键（读一次，兼容旧访客）
lang_key = "hanmosanguo-map:lang"
# 标签页标题 [中, 英]
doc_title = ["汉末三国形势图", "Late Han and the Three Kingdoms, 184–280"]
# 顶栏标题
h1 = ["汉末三国形势图", "Late Han and the Three Kingdoms"]
# 顶栏副题
sub = ["184 — 280 · 黄巾起事至三国归晋 · 古今地名对照", "184–280 · from the Yellow Turbans to the Jin reunification · historical and modern place names"]
# 地图的无障碍名称
map_label = ["汉末三国形势图", "Map of the late Han and the Three Kingdoms"]
# 视野：[代号, 中文名, 英文名, [西, 东, 南, 北]]，第一项为默认
fits = [
