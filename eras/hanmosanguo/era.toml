# 图例是否列「行军路线」
key_route = false
# 图例脚注 [中, 英]
foot = ["疆域据《后汉书》《三国志》《资治通鉴》《晋书》及谭其骧《中国历史地图集》第二、三册大意推定，以郡国为单位、沿山川划界，仅为示意。“诸侯”着色看实际控制者，“政权”着色看名义所属；220 年以前诸侯多奉汉朝正朔。战役与事件只显示当前节点所涵盖的年份（上一节点之后至本节点）。州界随时代切换：220 年前为东汉十三州，三国时为魏、蜀、吴各自的州，晋为太康十九州。", "Borders are reconstructed from the Book of the Later Han, the Records of the Three Kingdoms, the Zizhi tongjian and the Book of Jin, following in outline vols. 2–3 of Tan Qixiang’s Historical Atlas of China. Territory is assigned commandery by commandery and bounded along mountains and rivers, so it is only indicative. “Warlords” colors each area by who actually held it, “States” by nominal allegiance; before 220 most warlords still acknowledged the Han court. Battles and events are shown only for the years covered by the current snapshot (after the previous snapshot, up to this one). Province boundaries change with the period: the thirteen provinces of the Eastern Han before 220, each state’s own provinces under the Three Kingdoms, and the nineteen provinces of the Jin Taikang era."]
# 索引图高度（宽 140）
inset_h = 100
# 索引图范围 [西, 东, 南, 北]
inset_box = [72, 136, 15.5, 55]
# 经纬网（缺省按底图范围）：[经线起, 止, 纬度起, 止, 步长, 纬线起, 止, 经度起, 止, 步长]
grat = [75, 135, 15, 56, 1, 20, 55, 70, 138, 1]
# 斜线画法：zhen 只在二级单位着色下画；all 两种着色都画；缺省两种着色都画，政权着色下并入宗主国的单位另补斜线
hatch = "zhen"
# 斜线单位在说明里的标签
htag = ["名义臣属", "Nominal vassal"]
# 顶栏计数里二级单位的说法 [中, 英单数, 英复数]
