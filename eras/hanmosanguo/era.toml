  ["本期诸侯与政权（按实际控制）", "Warlords & states (actual control)"],
  ["本期政权（按名义所属）", "States (nominal allegiance)"],
]
# 索引里默认收起的组
closed = ["pref", "people", "other", "range", "road"]
# 索引里州府一组的名称
pref_group = ["郡国 · 城邑", "Commanderies & towns"]
# 对照表里州府的类别名
pref_kind = ["郡国", "Commandery"]
# 索引里其他时期一组的名称
other_group = ["其他时期的政权与诸侯", "States and warlords of other periods"]
# 索引里二级单位一组的名称
zhen_group = ["诸侯", "Warlords"]
# 英文检索框的提示
q_en = "Search names"
# 英文对照表、年表里关于日期的说明
date_note_en = "Dates give the lunar month of the Chinese sources (“1st month, 200”) and are not converted to the Western calendar; the year is the Western year in which most of that lunar year falls, so a 12th month can reach into January of the next year."
# 对照表导语（{n} 为节点数，{date_note} 为上一项）
table_intro = ["<p>图中全部郡国、城邑与地物，一名一行。郡国与城邑的“归属沿革”取自地图上 {n} 个时间节点，连续相同的归属合并显示。经纬度取今日遗址或所在城市，可在任意地图应用中定位；点击任一行回到地图并定位。</p>", "<p>Every commandery, town and feature on the map, one name per row. The allegiance of commanderies and towns is taken from the map’s {n} snapshots, with consecutive identical entries merged. Coordinates are those of the modern site or city and work in any map app; click a row to return to the map.</p><p>{date_note}</p>"]
# 年表导语
chron_intro = ["<p>把战役、事件、都城迁移与地图上的 {n} 个时间节点排成一条线，自黄巾起事至西晋灭吴。灰底为地图节点；点击任一事件，地图会跳到该事件之后最近的节点并定位。</p>", "<p>Battles, events, capital moves and the map’s {n} snapshots on a single line, from the Yellow Turban Uprising to the Jin conquest of Wu. Shaded entries are map snapshots; click any entry to jump to the nearest snapshot after it and locate it on the map.</p><p>{date_note}</p>"]
