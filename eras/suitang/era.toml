# 第六卷 隋及唐初：卷的基本信息。统一前端、总页时间轴和全局表都从这里读。
# 字段说明见 core/v1/FORMAT.md「era.toml」一节。

slug = "suitang"
volume = 6
title = "隋及唐初形势图"
title_en = "Sui and Early Tang"
short = "隋及唐初"            # 总页与时间轴上的短名
short_en = "Sui–Tang"

years = [581, 669]          # 起止年（含），公元前记负数，与总页一致
time = "month"             # 节点的时间精度：year 按年，month 按月
model = "layered"          # 数据模型：simple（战国式）或 layered（唐宋系）
first = [619, 12]         # 打开页面时停在哪个节点（年、月）
nodes = 26                 # 节点数（构建时核对）

[coloring]                  # 着色切换：按钮文字与内部代号；没有切换的卷为空
modes = [{ label = "都护", key = "zhen" }, { label = "政权", key = "pol" }]
default = "政权"

[layers]                    # 本卷用到的条目类别及条数（核对用）
river = 124
event = 60
battle = 56
capital = 50
range = 45
pass = 23
people = 16
canal = 6
desert = 3
route = 1

[projection]                # 新页面的投影：第 4 步起各卷统一，参数以 core/geo/config.toml 为准
kind = "albers"
parallels = [25, 47]
origin_lat = 35
central_lon = 105
seam = -30                  # 接缝经度，小于它的经度加 360°
legacy = [36, 102]           # 旧版页面（legacy.html）用的原点纬线、中央经线

[engine]                    # 第 5 步统一疆域引擎（core/engine/）的外缘设置；归属点与节点取 v1 数据包
outer = "frontier"          # 手绘外缘：content/frontier.py（北疆按主流唐极盛图）
geometry = "engine"         # 第 7 步起页面疆域由统一引擎出：eras/suitang/engine.json（构建时重算，入库），生成 v1 时换进去

[junction.prev]
era = "liangjin-nanbeichao"
at = "581"
note = "共用节点，以本卷为准"

[junction.next]
era = "tangsong"
at = "空档 669 — 755"
note = "隋唐卷延长到 755 年时补上"

[legacy]                    # 旧版：原仓库与原网址保持不变，总页上留「旧版 ↗」链接
repo = "Jackyijun/suitang-map"
url = "https://jackyijun.github.io/suitang-map/"
new_url = "https://jackyijun.github.io/lidai-yutu/suitang/"
