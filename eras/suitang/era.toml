foot = ["疆域据《隋书》、两《唐书》、《资治通鉴》及谭其骧《中国历史地图集》第五册大意推定，以州郡为单位、沿山川划界，仅为示意。北方外缘参照该图集总章二年图及通行唐极盛图描画：西起咸海北岸，循哈萨克丘陵北缘、额尔齐斯河、阿尔泰山、叶尼塞河中游，绕贝加尔湖北端（骨利干），经石勒喀河、黑龙江至入海口；斜线为羁縻都护、都督府，多为名义统属，草原诸部并无确切界线。战役与事件只显示当前节点所涵盖的时段（上一节点之后至本节点），运河自开凿之年起显示。点击疆域、城邑、战役、山川均可查看说明。", "Borders are reconstructed from the Sui shu, the two Tang histories and the Zizhi tongjian, following in outline vol. 5 of Tan Qixiang’s Historical Atlas of China. Territory is assigned prefecture by prefecture and bounded along mountains and rivers, so it is only indicative. The northern limit follows the atlas’s map for 669 and the usual maps of the Tang at its height: from the north shore of the Aral Sea along the northern edge of the Kazakh uplands, the Irtysh, the Altai and the middle Yenisei, round the northern end of Lake Baikal (the Kurykans), then along the Shilka and the Amur to its mouth. Hatching marks loose-rein protectorates and area commands, mostly nominal; the steppe peoples had no fixed borders. Battles and events are shown only for the period covered by the current snapshot (after the previous snapshot, up to this one); canals appear from the year they were dug. Click any territory, town, battle, mountain or river for a note."]
