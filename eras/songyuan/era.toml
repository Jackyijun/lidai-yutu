# 英文对照表、年表里关于日期的说明
date_note_en = "Dates in East Asia give the lunar month (“5th month, 979”); the year is the Western year in which most of that lunar year falls, so a 12th month can reach into January of the next year. Dates elsewhere use Julian months."
# 对照表导语（{n} 为节点数，{date_note} 为上一项）
table_intro = ["<p>图中全部州府、城邑与地物，一名一行。州府的“归属沿革”取自地图上 {n} 个时间节点，连续相同的归属合并显示。经纬度取今日遗址或所在城市，可在任意地图应用中定位；点击任一行回到地图并定位。</p>", "<p>Every prefecture, town and feature on the map, one name per row. A prefecture’s allegiance is taken from the map’s {n} snapshots, with consecutive identical entries merged. Coordinates are those of the modern site or city and work in any map app; click a row to return to the map.</p><p>{date_note}</p>"]
# 年表导语
chron_intro = ["<p>把战役、事件、行军、都城迁移、灭国、归附与地图上的 {n} 个时间节点排成一条线。灰底为地图节点；点击任一事件，地图会跳到该事件之后最近的节点并定位。</p>", "<p>Battles, events, campaigns, capital moves, the fall or submission of states and the map’s {n} snapshots on a single line. Shaded entries are map snapshots; click any entry to jump to the nearest snapshot after it and locate it on the map.</p><p>{date_note}</p>"]
# 年表收哪些年份的都城迁移 [起, 止, 起是否不含]（起为 false 取首节点，止为 false 不设上限）
chron_cap = [979, 1279, false]
