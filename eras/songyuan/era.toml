  ["ln", "两广·交趾", "Lingnan & Đại Việt", [103, 118, 16, 26.6]],
  ["nz", "吐蕃·大理", "Tibet & Dali", [78, 108, 20, 37]],
  ["db", "东北·高丽", "Manchuria & Goryeo", [116, 135, 36, 50]],
  ["mb", "漠北草原", "Mongolian steppe", [86, 125, 40, 53]],
  ["xy", "西域·西辽", "Western Regions & Western Liao", [66, 97, 35, 48.5]],
