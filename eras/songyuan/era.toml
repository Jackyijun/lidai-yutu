# 第八卷 宋辽夏金元：卷的基本信息。统一前端、总页时间轴和全局表都从这里读。
# 字段说明见 core/v1/FORMAT.md「era.toml」一节。

slug = "songyuan"
volume = 8
title = "宋辽夏金元形势图"
title_en = "Song · Liao · Xia · Jin · Yuan"
short = "宋辽夏金元"            # 总页与时间轴上的短名
short_en = "Song–Yuan"

years = [979, 1279]          # 起止年（含），公元前记负数，与总页一致
time = "year"             # 节点的时间精度：year 按年，month 按月
first = 1120                 # 打开页面时停在哪一年的节点
nodes = 62                 # 节点数（构建时核对）

[coloring]                  # 着色切换：按钮文字与内部代号；没有切换的卷为空
modes = [{ label = "路·汗国", key = "zhen" }, { label = "政权", key = "pol" }]
default = "政权"

[layers]                    # 本卷用到的条目类别及条数（核对用）
river = 197
battle = 147
capital = 100
range = 70
event = 58
pass = 30
people = 27
route = 15
desert = 15
canal = 8
region = 1

[projection]                # 新页面的投影：第 4 步起各卷统一，参数以 core/geo/config.toml 为准
kind = "albers"
parallels = [25, 47]
origin_lat = 35
central_lon = 105
seam = -30                  # 接缝经度，小于它的经度加 360°
legacy = [38, 95]           # 旧版页面（原仓库的网页，见 [legacy]）用的原点纬线、中央经线

[engine]                    # 第 5 步统一疆域引擎（core/engine/）的外缘设置；归属点与节点取 v1 数据包
outer = "reach"             # 按可达代价定外缘（参数见 core/engine/config.toml 的 [outer]）
geometry = "engine"         # 第 7 步起页面疆域由统一引擎出：eras/songyuan/engine.json（构建时重算，入库），生成 v1 时换进去
simplify = 0.25             # 覆盖简化容差（格，约 1.8 km）：默认 0.06 格时页面疆域约翻倍（民国卷超过 20 MB），放宽到与旧引擎相当
box = [14.0, 146.0, 10.0, 62.0]   # 推算范围 [西, 东, 南, 北]
seeds = "content/seeds.txt" # 各点可达倍数（R=）写在这里

[junction.prev]
era = "tangsong"
at = "979"
note = "共用节点，以哪一卷为准待定"

[junction.next]
era = "minguo-xinzhongguo"
at = "空档 1279 — 1911"
note = "元明卷 yuanming、清卷 qing 待补"

[legacy]                    # 旧版：原仓库与原网址保持不变，总页上留「旧版 ↗」链接
repo = "Jackyijun/songyuan-map"
url = "https://jackyijun.github.io/songyuan-map/"
new_url = "https://jackyijun.github.io/lidai-yutu/songyuan/"

[web]                       # 新页面（core/web/template.html）各卷不同的文字与开关，说明见 core/web/README.md
# 时间单位：year 年；ym 年 + 月（隋唐、两晋）；t 月序号（民国）；qinhan 月序号、通鉴纪年（秦汉）
time = "year"
# 旧版页面记界面语言用的键（读一次，兼容旧访客）
lang_key = "songyuan-map:lang"
# 标签页标题 [中, 英]
doc_title = ["宋辽夏金元形势图", "Song, Liao, Xia, Jin and Yuan, 979–1279"]
# 顶栏标题
