key_route = true
# 图例脚注 [中, 英]
foot = ["疆域据《宋史》《辽史》《金史》《元史》《续资治通鉴长编》《建炎以来系年要录》及谭其骧《中国历史地图集》第六、七册大意推定；中亚、西亚、欧洲部分据通行史地图集大意推定。以州府城邑为单位、沿山川划界，仅为示意。斜线为藩属或附庸。战役、事件与行军路线只显示当前节点所涵盖的年份（上一节点之后至本节点）。红色虚线为燕云十六州（至 1125 年）。", "Borders are reconstructed from the Song, Liao, Jin and Yuan dynastic histories, Li Tao’s Xu zizhi tongjian changbian and Li Xinchuan’s Jianyan yilai xinian yaolu, following in outline vols. 6–7 of Tan Qixiang’s Historical Atlas of China; Central Asia, West Asia and Europe follow standard historical atlases. Territory is assigned prefecture by prefecture and bounded along mountains and rivers, so it is only indicative. Hatching marks vassals and tributaries. Battles, events and campaign routes are shown only for the years covered by the current snapshot (after the previous snapshot, up to this one). The red dashed line marks the Sixteen Prefectures (until 1125)."]
# 索引图高度（宽 140）
inset_h = 84
# 索引图范围 [西, 东, 南, 北]
inset_box = [14, 146, 10, 62]
# 推算范围以外罩一层薄纸色并以虚线标出
veil = true
# 斜线单位当作藩属：政权着色下加虚线轮廓与名称，说明标「藩属·附庸 / 宗主」，索引另列一组
vassal = true
# 顶栏计数里二级单位的说法 [中, 英单数, 英复数]
count_zhen = ["个路·汗国", "subdivision", "subdivisions"]
# 顶栏计数不算斜线单位
count_skip_h = true
# 政权说明里「领 N 州」的说法 [中（{n} 为数）, 英单数, 英复数]
holds = ["领 {n} 州（处）", "prefecture", "prefectures"]
# 所领地点一行的标题
holds_label = ["领州", "Prefectures"]
# 诸族年代：[起界, 起界文字, 止界, 止界文字, 「约」放最前]
people = [979, ["宋初", "early Song"], 1279, ["宋末", "late Song"], true]
# 时间轴刻度的样式：[字段, 比较, 值, 样式名]，取第一条符合的
era_cls = [["y", ">=", 1271, "era-y"], ["y", ">=", 1127, "era-s"]]
# 索引里默认收起的组
closed = ["pref", "people", "other", "range", "zhen"]
# 索引里其他时期一组的名称
