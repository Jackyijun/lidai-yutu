# 国界墙（规范第十三节「混合疆域法」）：统一疆域引擎把这些界线在代价栅格里烧成高代价带，归属分区不越过；
# 墙的峰值、宽度、归属点周围不烧的半径在 core/engine/config.toml 的 [walls]。只用于 era.toml 的 [engine] 写了
# walls = true 的卷，现在只有民国卷。2026-11-21（架构整理第五批）由民国卷 src/config.py 搬来（原 WALL_SKIP、
# VAR_NE_WALLS、MANUAL_WALLS），内容不变；以后元明、清卷也从这里取，到时按各段的起止补上年月。
# 坐标是 [经度, 纬度]；时间写「年.月」，from 含、to 不含，不写的一端不限。

# 今国界：Natural Earth 1:10m 的国界去掉海岸线，整体烧成墙；下面这些框里的段不用（近代未定或晚出的界线）。

