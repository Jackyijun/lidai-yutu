# 相邻两卷的衔接与空档。
#
# 衔接年份上两卷各画了一次疆域：
#   shared   两卷共用同一年的节点。owner 是以哪一卷为准，另一卷在这一年应当与它一致。
#   adjacent 前一卷最后一年、后一卷第一年，相邻两年各画一次，不共用节点。
# 两卷实际画得一样不一样，见 global/review/junctions.md（python core/v1/registry.py 生成）。
#
# 空档是还没有卷覆盖的年代，plan 写准备由哪一卷补上。

[[junction]]
from = "chunqiu"
to = "zhanguo"
year = [-476, -475]
kind = "adjacent"
note = "两卷衔接节点上共有的政权疆域完全一致"

[[junction]]
from = "zhanguo"
to = "qinhan"
year = -212
kind = "shared"
owner = "zhanguo"
note = "秦汉卷构建时照搬战国卷末节点前212 的秦、卫外廓、秦郡郡界与文字（eras/qinhan/src/build.py）"

[[junction]]
from = "qinhan"
to = "hanmosanguo"
year = 184
kind = "shared"
owner = "hanmosanguo"
note = "秦汉卷构建时照搬汉末卷首节点 184 的政权外廓与文字，汉的郡国由引擎算出后裁进汉末卷的外廓；汉末卷 2026-11-16 删去 94 年序幕节点，从 184 年开始；2026-11-19 汉末卷换到统一引擎后，外廓取 eras/hanmosanguo/engine.json"

[[junction]]
from = "hanmosanguo"
to = "liangjin-nanbeichao"
year = 280
kind = "shared"
owner = "hanmosanguo"
note = "两晋卷旧构建读入 eras/liangjin-nanbeichao/geodata/junction_hanmo280.json；2026-11-19 汉末卷换到统一引擎后，新页面在汉末卷的推算范围内照搬它的引擎几何（core/v1/engine_geom.py），汉末卷留白处照两晋卷画"

[[junction]]
from = "liangjin-nanbeichao"
to = "suitang"
year = 581
kind = "shared"
owner = "suitang"
note = "两晋卷构建时读入 eras/liangjin-nanbeichao/geodata/junction_suitang581.json"

[[junction]]
from = "tangsong"
to = "songyuan"
year = 979
kind = "shared"
owner = "songyuan"
note = "2026-11-15 定：以宋元卷为准。宋元卷 979 年的女真要改为不属辽；唐宋卷 979 年节点照宋元卷对齐（见 global/corrections.md）"

[[gap]]
after = "suitang"
before = "tangsong"
years = [669, 755]
plan = "隋唐卷延长到 755 年（第 8 步）"

[[gap]]
after = "songyuan"
before = "minguo-xinzhongguo"
years = [1279, 1911]
plan = "元明卷 yuanming、清卷 qing（第 8 步）"
