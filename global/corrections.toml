# 各卷页面里要改的内容（坐标以外）。手写；坐标的改正由 decisions.toml 的 [[place]]、[[seat]] 自动推出。
# 两者都汇总进 global/corrections.md。改完一条就删一条。
# era 卷短名；at 年份或节点；what 改什么；why 依据。
# 不牵动疆域的标 step = 3 和 id：第 3 步由 core/v1/overlay.py 在新页面上先改（id 对应其中的改正函数）；其余留到第 5—7 步。

[[fix]]
id = "tangsong-zhancheng"
step = 3
era = "tangsong"
at = "9 世纪后期起（877 年以后各节点）"
what = "「环王（占城）」改称「占城」；此前各节点标「环王」"
why = "8 世纪中叶中国史书改称林邑为环王，到 9 世纪通称占城；《新五代史》已作占城。"

