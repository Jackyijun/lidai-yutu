# 全局配色（规范第三节）：按政权全局 ID（global/polities.jsonl 的 id）统一浅色、深色，套用于各卷 v1 数据（core/v1/overlay.py）。
# 每个政权都在这里定色（架构整理第三批起，缺了构建停下）：前面是改定的配色，文末一段是从各卷旧构建冻结下来的。
# 民国卷只改了荷兰、西藏地方政府、阿富汗三处（与英属地分不开），只在民国卷「其余」色带（土黄—橄榄—绿—青绿，低彩度）里选，不用紫、红、蓝。
# 主朝取五德之色（轻量版，低饱和）：秦水德尚黑，汉火德尚赤（东汉定火德；西汉曾改土德，统一按火德），
# 新、曹魏、唐土德尚黄，晋金德尚白，隋、宋火德尚赤；蜀汉承汉火德，取浅一档的赤。
# 其余政权按九卷各节点里的邻接（政权、郡镇两种着色，浅深两种底色）算色差，在低彩度 OKLCH 色板里避让，尽量少改；
# 同一政权跨卷同色。深色由浅色在 OKLCH 里提亮 0.06、加彩 0.015 得出（水德的深色另定，免得在深色底上看不见）。
# 新政权：python tools/palette.py 按统一引擎算出的疆域邻接选色，--write 写在 [color] 末尾（架构整理第五批起）。

[wude]
"水德" = "#4A5E6A"
"火德" = "#B26A5E"
"土德" = "#C5A579"
"金德" = "#94A0AE"

[wude.gid]
"秦" = "水德"
