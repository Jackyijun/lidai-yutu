# 全局表的人工决定。
# 自动归并的规则见 core/v1/FORMAT.md「全局表」一节；规则判断不了的，在这里写明，
# 然后运行 python core/v1/registry.py 重建 global/ 下的各表与 global/review/ 下的审定清单。
#
# 引用一律写成「卷短名:键」：
#   地点   chunqiu:i:303（条目序号）  songyuan:相州（州府的 id）
#   政权   tangsong:契丹  songyuan:辽（单位的键）
# 审定清单里每一条都附了引用，直接复制即可。年份公元前记负数。
#
# 地点的审定规则（2026-11-15 与用户定）：
#   1. 同一座城，只是各卷取点不同：统一成最准的一个坐标。
#   2. 同一座城（同名，或只是改名），城被毁后在近处重建、或短距离迁址：仍是一个地点，坐标按年代分段（sites 的 from / to）。
#   3. 另一座城（原本就在、或另起新城，另有名字）：拆开。州郡治所从甲城迁到乙城时，这个州那一条按年代挂到两城上（[[seat]]）。
#   4. 相距 40 km 以上的一律拆开。
# 坐标与各卷不符的，自动列进 global/corrections.md，生成 v1 时照改（core/v1/overlay.py）；[places.keep] 列出的不改。

[places]
split = [
  "qinhan:广平",          # 西汉广平县在鸡泽东南，与北朝以后的广平郡、洺州（永年广府）不是一城
  "qinhan:单于庭（漠南）",  # 秦汉卷漠南单于庭（2026-11-18 加），与隋唐以后各卷的「漠南」分区点不是一地
  "qinhan:i:225",         # 同上，都城条目
]
merge = [
  ["qinhan:单于庭（漠南）", "qinhan:i:225"],   # 拆出后两者仍是一处
]

[places.keep]
# 坐标改正不套用的条目（引用 = 原因）：一个点只有一个坐标，照城址挪了反而不对的（2026-11-19）
"liangjin-nanbeichao:瀛州" = "乐成与本卷乐寿同在献县，挪过去两点重合；留在河间（487 年起瀛州治所）"

[places.id]
# 已发布的全局 ID 不改（深链接 sel=place:… 跨卷通用）。秦汉卷并入后自动取名会变的，在这里钉住原 ID（2026-11-16）
