# ================================================================ 译名
# 同一对象、同一中文名，各卷英文不同的。键是「全局 ID|中文」。
#   unify：统一成一种写法，其余卷列进改正清单
#   by_era：按时代各用各的（不同时期的通行写法，或关隘与同名县城是两个对象）
# 山川默认统一成用得最多的写法，不必写在这里。

[glossary]
by_era = [
  "阿里什|阿里什",          # 宋元 al-Arish（中世纪阿拉伯语转写），民国 El Arish（近代通行）
  "特拉比松|特拉布宗",      # 两晋 Trapezus（罗马时期），民国 Trebizond
  "莎车|莎车",              # 各卷译名体例：古代 Yarkand，民国用今名拼音
  "焉耆|焉耆",              # 同上：Karasahr / Yanqi
  "高昌|高昌",              # 麴氏高昌 Gaochang，回鹘高昌 Qocho
  "坚昆|黠戛斯牙帐",        # 唐宋 khagan，宋元 khan，随时代称号
  "陕州|陕县",              # 各卷县名体例：Shan County / Shanxian
  "随州|随县",              # 同上
  "潼关|潼关",              # 关隘 Tong Pass，民国县城 Tongguan，是两个对象
  "山海关|山海关",          # 关隘 Shanhai Pass，城镇 Shanhaiguan
  "建安城|建安城",          # 隋唐时为高句丽城，用朝鲜语读音 Geonan；此后用汉语读音
  "韩|韩",                  # 战国 Han；秦汉卷与汉并存，作 Han (韓) 以示区别
  "襄平|辽东城",            # 同上：Yodong Fortress / Liaodong City
  "river:长江|江",          # 春秋、战国作 Jiang（先秦专名「江」），此后作 Yangtze
  "river:黄河|河",          # 同上：He / Yellow River
]

[glossary.unify]
"峰州|峰州" = "Phong Châu"          # 越南地名一律用越南语写法（译名体例），隋唐卷改
"驩州|驩州" = "Hoan Châu"
"爱州|爱州" = "Ái Châu"
"交州|交州" = "Giao Châu"
"孟津|孟津" = "Mengjin Ford"        # 是渡口
"井陉|井陉" = "Jingxing Pass"       # 是关隘
"奚王牙帐|奚王牙帐" = "Xi royal camp"
"于阗|于阗" = "Kingdom of Khotan"
