# ================================================================ 政权

[polities]
# 两卷名字不同、其实是同一政权的，每组写成一个列表
merge = [
  ["liangjin-nanbeichao:于阗", "tangsong:于阗"],                      # 于阗王国一直延续到 1006 年
  ["tangsong:契丹", "songyuan:辽"],                                   # 947 年改国号辽
  ["tangsong:安南", "songyuan:大越"],                                 # 唐安南都护府、静海军 → 968 年大瞿越 → 1054 年大越
  ["tangsong:定难", "songyuan:西夏"],                                 # 党项定难军 → 1038 年西夏
  ["suitang:林邑", "tangsong:环王", "songyuan:占城"],                 # 中国史书：林邑 → 环王（8 世纪中叶）→ 占城（9 世纪）
  ["suitang:真腊", "tangsong:文单", "songyuan:真腊"],                 # 真腊 → 分陆真腊（文单）、水真腊 → 802 年统一（吴哥）
  ["tangsong:凉州蕃部", "songyuan:六谷部"],                           # 西凉府吐蕃联盟（906—1016）
  ["qinhan:北匈奴", "hanmosanguo:北匈奴"],                            # 48 年匈奴分南北，91 年北单于西走
  ["qinhan:南匈奴", "hanmosanguo:南匈奴"],                            # 48 年日逐王比自立为南单于，附汉
  ["qinhan:凉州叛军", "hanmosanguo:韩遂"],                            # 184 年衔接节点上两卷都注作「凉州叛军」
  ["qinhan:乌孙", "liangjin-nanbeichao:乌孙"],
  ["qinhan:康居", "liangjin-nanbeichao:康居"],
  ["qinhan:贵霜", "liangjin-nanbeichao:贵霜"],
]

# 全局 ID。同名政权的取名原则：统一王朝与南北朝诸朝用本名，同名的先秦诸侯国、十国政权加卷名
[polities.id]
"songyuan:宋" = "宋"
"chunqiu:宋" = "宋·春秋"
"liangjin-nanbeichao:陈" = "陈"
"chunqiu:陈" = "陈·春秋"
"liangjin-nanbeichao:于阗" = "于阗"
"songyuan:辽" = "辽"
"songyuan:大越" = "大越"
"songyuan:西夏" = "西夏"
"songyuan:占城" = "占城"
"songyuan:真腊" = "真腊"
"songyuan:六谷部" = "凉州六谷部"
"hanmosanguo:汉" = "东汉"                     # 秦汉卷并入后含西汉，ID 仍用汉末卷首发时的「东汉」，深链接不变
"hanmosanguo:韩遂" = "韩遂·马腾"


# ================================================================ 山川
# 各卷画法不同的，定以哪一卷的几何为准（统一引擎的全局山脉取这一条）；写 page = true 的，各卷页面上也改画成这一条（core/v1/overlay.py）。

[physical]
# 春秋、战国的「泰山·沂山」把泰山和沂山连成一条，与其余各卷单画的泰山不是同一个对象；
# 春秋卷的菏水（吴王夫差所开，连济、泗）与战国卷的鸿沟是两条运河，原先因今名相同被并在一起
split = ["chunqiu:i:427", "zhanguo:i:432", "chunqiu:i:473"]

[physical.id]
# 已发布的全局 ID 不改：秦汉卷并入后自动取名会变的，钉住原 ID
