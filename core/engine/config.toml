# 第 5 步：统一疆域引擎。各卷共用的参数都在这里（规范第十三节、第十九节）。
#
# 疆域 = 归属点 + 通行代价栅格 + 多源最短路。代价栅格是一张全球统一的格网：
# 格子的位置、地形、山脉、随机扰动只由经纬度决定，与卷无关，所以同一个地方在哪一卷代价都一样，
# 相邻两卷可以共用归属点。各卷只取自己范围那一块来算。
#
# 改这里任何一项，所有用新引擎的卷都要重建。

[grid]
cell = 1.1                  # 格边长（投影单位；1 单位 = 地球半径 / 1000 ≈ 6.37 km，1.1 ≈ 7.0 km）
tile = 256                  # 随机场按 256 × 256 格分块生成，每块的种子只由块号决定（与卷无关）
seed = 20261115             # 全局随机种子：噪声、位移场都由它派生；改了全部重算

[cost]
# 平地代价 1；加地形起伏、高海拔、山地、山脊带、界河，再乘多尺度平滑噪声。
# 地形项取宋元式（起伏 + 高海拔 + Natural Earth 山地多边形）：按可达代价定外缘的卷（宋元、民国）对它最敏感，
# 隋唐式的坡度项在横断山一类陡峭山地代价过高，宋元卷的川西外缘会缩回去。拿隋唐、宋元两卷试过五种组合，这一组两卷合计差别最小。
slope = 0.0                 # 坡度（隋唐式）：每 米/公里 加多少；0 为不用
slope_max = 40
slope_sigma = 1.2           # 算坡度前先把高程平滑（格）
plateau = [3000, 4500, 0.0] # 高原（隋唐式）：海拔从 a 到 b 线性加到 +c；0 为不用
relief = [1.1, 3]           # 起伏：ETOPO20 3×3 窗口（约 110 km）内高差每千米加 1.1，上限 3 千米
high = [2500, 0.9, 3]       # 高海拔：2500 m 以上每千米加 0.9，上限 3 千米
range_poly = [1.2, 3.0]     # Natural Earth 山地多边形整体加价：权重、高斯模糊格数
big_lake = 0.15             # 面积（平方度）以上的湖不可通行

[cost.ridge]
# 山脉脊线：取全局山川表（global/physical.jsonl）里每条山脉的一种画法；按名字定的相位横向摆动，与卷无关
major = 8.0                 # 主干峰值
minor = 3.5                 # 次要峰值
sigma_km = [10.0, 10.0]     # 高斯带宽（标准差，km）：主干、次要
min_len = 0.8               # 短于此长度（度）的孤山不烧脊线
wiggle = [8.0, 120.0]       # 横向摆动：振幅 km、波长 km

[cost.river]
# 界河：全局 ID → 峰值。河道取节点所在时代那一卷画的（黄河、淮河历代改道）
sigma_km = 7.0
weights = { "river:长江" = 5.0, "river:黄河" = 5.0, "river:淮河" = 4.0, "river:汉江" = 2.5, "river:阿姆河" = 2.5, "river:喷赤河" = 2.0, "river:锡尔河" = 2.0, "river:纳伦河" = 1.5, "river:幼发拉底河" = 2.5, "river:底格里斯河" = 1.5, "river:多瑙河" = 4.0, "river:伏尔加河" = 2.0, "river:第聂伯河" = 1.5, "river:顿河" = 1.2, "river:乌拉尔河" = 1.5, "river:印度河" = 2.0, "river:库拉河" = 1.5, "river:黑龙江" = 2.5, "river:鸭绿江" = 2.0, "river:图们江" = 2.0, "river:乌苏里江" = 2.0, "river:松花江" = 1.5, "river:金沙江" = 2.0, "river:大渡河" = 1.5, "river:怒江" = 3.0, "river:澜沧江" = 2.0, "river:湄公河" = 2.0, "river:嘉陵江" = 1.2, "river:约旦河" = 2.0 }

[cost.noise]
amp = 0.38                  # 代价乘以 1 ± amp 的平滑噪声
scales = [[3, 0.25], [8, 0.35], [20, 0.40]]   # （高斯 σ 格, 权重）
clip = 2.2                  # 先截在 ±clip 个标准差，再缩到 ±1

[walls]
# 国界墙（民国式混合疆域法，规范第十三节）：已划定的国界烧成高代价带，归属点推出的疆域贴着它走
peak = 60.0                 # 峰值
width_km = 14.0             # 半宽：代价 = 峰值 × exp(-(距离 / 半宽)²)
prov = [5.0, 10.0]          # 今中国省界弱墙：峰值、半宽 km
carve = [8.0, 22.0]         # 归属点周围这么多 km 内不烧墙，到外圈恢复全强度

[partition]
neighbors = 16              # 16 邻接（含马步）
snap = 15                   # 归属点落在海里时，向最近陆地格挪动的最大格数
fill_sea = 6                # 疆域向海面延伸的格数（页面按陆地裁剪，海岸不留缝）；大湖全部填满
frontier_pad = 3            # 手绘外缘向外留的格数（栅格只建在外缘以内）

[outer]
# 按可达代价定外缘的卷（宋元、民国）：超出可达代价的格子为无主地，连成大片才算；外缘闭运算、平滑
reach = 130                 # 默认可达代价（代价 × 投影单位）；各点可在 seeds 文件里写 R=倍数
close = 12                  # 外缘闭运算半径（格，约 0.75°），填平圆弧之间的凹口
hole_max = 600              # 小于此格数（约 3 万平方公里）的无主空隙并回相邻一方
edge_sigma = 4.0            # 外缘高斯平滑（格）；平滑时海面当作有主，免得海岛、半岛尖被磨掉

[trace]
smooth = 1.2                # 归属栅格高斯平滑 σ（格），界线描在相邻两类平滑值相等处
laplace = [0.5, 3]          # 界线网络拉普拉斯平滑（步长, 轮数）
min_face = 2.0              # 小于此面积（平方格）的零星碎块并入相邻一方
simplify = 0.06             # 覆盖简化容差（格）
min_part = 0.3              # 小于此面积（平方投影单位）的碎块舍去
min_ring = 0.6              # 输出时丢掉小于此面积（平方投影单位）的环

[trace.warp]
# 位移场：给界线带上河曲一样的小弯（两种尺度，合计约 1—2 格）
scales = [[4.0, 0.7], [10.0, 0.9]]   # （平滑尺度 σ 格, 标准差 格）
taper = 5                   # 界河两侧这么多格内渐减为 0，免得沿河的分界被推离河道
pin = 1.0                   # 界线挪动后离任何归属点不得近于这么多格：挨得近的两点之间的界线不会被推过点去，单点飞地不会被挤没
